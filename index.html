          <div class="seg seg-speed" role="radiogroup" aria-label="재생 속도">
            <button type="button" role="radio" data-speed="1">1배속</button>
            <button type="button" role="radio" data-speed="0.5">½배속</button>
            <button type="button" role="radio" data-speed="0.25">¼배속</button>
          </div>
        </div>
        <dl class="readout">
          <div><dt>시간</dt><dd><span id="r-time"></span> s</dd></div>
          <div><dt>높이</dt><dd><span id="r-height"></span> m</dd></div>
          <div><dt>속력</dt><dd><span id="r-speed"></span> m/s</dd></div>
          <div><dt>최고 속력</dt><dd><span id="r-max"></span> m/s</dd></div>
        </dl>
      </section>

      <section class="panel energy-panel">
        <h2>에너지</h2>
        <div class="bars">
          <div class="bar" data-key="kinetic">
            <span class="bar-value"></span>
            <div class="bar-track"><div class="bar-fill"></div></div>
            <span class="bar-label">운동<br />에너지</span>
          </div>
          <div class="bar" data-key="potential">
            <span class="bar-value"></span>
            <div class="bar-track"><div class="bar-fill"></div></div>
            <span class="bar-label">위치<br />에너지</span>
          </div>
          <div class="bar" data-key="heat" hidden>
            <span class="bar-value"></span>
            <div class="bar-track"><div class="bar-fill"></div></div>
            <span class="bar-label">열에너지<br />등</span>
          </div>
          <div class="bar total">
            <span class="bar-value"></span>
            <div class="bar-track stack">
              <div class="seg-potential"></div>
              <div class="seg-kinetic"></div>
              <div class="seg-heat"></div>
            </div>
            <span class="bar-label">역학적<br />에너지</span>
          </div>
        </div>
        <div id="formula" class="formula"></div>
      </section>

      <section class="panel graph-panel">
        <div class="panel-head">
          <h2>시간에 따른 에너지</h2>
          <ul class="legend">
            <li><i class="sw sw-potential"></i>위치</li>
            <li><i class="sw sw-kinetic"></i>운동</li>
            <li><i class="sw sw-ink"></i>역학적</li>
            <li class="legend-heat"><i class="sw sw-heat"></i>열 등</li>
          </ul>
        </div>
        <canvas id="graph"></canvas>
      </section>

      <section class="panel control-panel">
        <h2>실험 조건</h2>
        <div class="field">
          <label for="in-angle">놓는 각도</label>
          <input id="in-angle" type="range" min="0" max="90" step="1" value="30" />
          <output id="in-angle-val"></output>
        </div>
        <div class="field">
          <label for="in-mass">질량</label>
          <input id="in-mass" type="range" min="0.1" max="2" step="0.1" value="1" />
          <output id="in-mass-val"></output>
        </div>
        <div class="field">
          <label for="in-length">줄 길이</label>
          <input id="in-length" type="range" min="0.2" max="2" step="0.05" value="1" />
          <output id="in-length-val"></output>
        </div>
        <div class="field high-only">
          <label for="in-gravity">중력</label>
          <select id="in-gravity">
            <option value="9.8">지구 (9.8 m/s²)</option>
            <option value="1.6">달 (1.6 m/s²)</option>
            <option value="3.7">화성 (3.7 m/s²)</option>
            <option value="24.8">목성 (24.8 m/s²)</option>
          </select>
        </div>
        <div class="field field-check">
          <input id="in-drag" type="checkbox" />
          <label for="in-drag">공기 저항</label>
        </div>
        <p class="hint">조건을 바꾸면 추가 같은 각도에서 다시 출발합니다.</p>
      </section>

      <section class="panel question-panel" id="questions"></section>

      <section class="panel standards-panel" id="standards"></section>
    </main>

  </body>
</html>
